name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  API_PROJECT: src/Fiap.TechChallenge.Execution.Api/Fiap.TechChallenge.Execution.Api.csproj
  UNIT_TEST_PROJECT: tests/Fiap.TechChallenge.Execution.UnitTests/Fiap.TechChallenge.Execution.UnitTests.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout shared contracts
        uses: actions/checkout@v4
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move shared to sibling directory (../shared)
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet restore ${{ env.UNIT_TEST_PROJECT }}

      - name: Build
        run: |
          dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore
          dotnet build ${{ env.UNIT_TEST_PROJECT }} --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test ${{ env.UNIT_TEST_PROJECT }} --configuration Release --no-build --verbosity normal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Build (with shared context)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            shared=../shared
          push: false
          load: true
          tags: execution-service:ci
