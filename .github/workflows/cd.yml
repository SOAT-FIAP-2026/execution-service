name: CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/soat-fiap-2026/execution-service
  API_PROJECT: src/Fiap.TechChallenge.Execution.Api/Fiap.TechChallenge.Execution.Api.csproj
  UNIT_TEST_PROJECT: tests/Fiap.TechChallenge.Execution.UnitTests/Fiap.TechChallenge.Execution.UnitTests.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Execution Service
        uses: actions/checkout@v4

      - name: Checkout shared contracts
        uses: actions/checkout@v4
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move shared to sibling directory (../shared)
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet restore ${{ env.UNIT_TEST_PROJECT }}

      - name: Build
        run: |
          dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore
          dotnet build ${{ env.UNIT_TEST_PROJECT }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.UNIT_TEST_PROJECT }} --configuration Release --no-build --verbosity normal

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Execution Service
        uses: actions/checkout@v4

      - name: Checkout shared contracts
        uses: actions/checkout@v4
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move shared to sibling directory (../shared)
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha256-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            shared=../shared
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

