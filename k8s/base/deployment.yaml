apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: techchallenge
  labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: techchallenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: techchallenge
    spec:
      containers:
        - name: execution-service
          image: techchallenge-execution-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: execution-service-config
          env:
            - name: ConnectionStrings__ExecutionDb
              valueFrom:
                secretKeyRef:
                  name: execution-service-secrets
                  key: connection-string
                  optional: true
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: execution-service-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false

